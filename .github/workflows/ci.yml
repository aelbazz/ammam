name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, test and build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profile
          POSTGRES_PASSWORD: profile
          POSTGRES_DB: profile_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profile -d profile_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://profile:profile@localhost:5432/profile_test?schema=public
      # No pooler in CI, so the direct url is the same connection.
      DIRECT_URL: postgresql://profile:profile@localhost:5432/profile_test?schema=public
      # CI-only values. Real secrets are never needed here: the job runs against a
      # throwaway database that is destroyed with the runner.
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      JWT_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:4200
      NODE_ENV: test
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-password-not-a-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Lint
        run: yarn lint

      - name: Unit tests
        run: yarn test --ci

      - name: Apply migrations
        run: yarn prisma:deploy

      - name: Seed the database from the vendored frontend snapshot
        run: yarn db:seed

      - name: End-to-end tests
        run: yarn test:e2e --ci

      - name: Build
        run: yarn build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only - publishing happens in deploy.yml.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: profile-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
