name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_seed:
        description: 'Run the data import after migrating (first deploy only)'
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Re-verify rather than trusting that CI already passed on this commit.
  verify:
    name: Production checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: profile
          POSTGRES_PASSWORD: profile
          POSTGRES_DB: profile_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U profile -d profile_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://profile:profile@localhost:5432/profile_verify?schema=public
      DIRECT_URL: postgresql://profile:profile@localhost:5432/profile_verify?schema=public
      JWT_SECRET: ci-only-secret-value-at-least-32-characters-long
      CORS_ORIGINS: http://localhost:4200
      NODE_ENV: test
      ADMIN_EMAIL: ci-admin@example.com
      ADMIN_PASSWORD: ci-only-password-not-a-secret

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn prisma:generate
      - run: yarn lint
      - run: yarn test --ci
      - run: yarn prisma:deploy
      - run: yarn db:seed
      - run: yarn test:e2e --ci
      - run: yarn build

  migrate:
    name: Apply database migrations
    runs-on: ubuntu-latest
    needs: verify
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
      - run: yarn prisma:generate

      # `migrate deploy` only applies committed migrations. It never generates a new one
      # and never resets - `migrate dev` must never run against production.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Migrations must not go through the transaction pooler.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: yarn prisma:deploy

      - name: Import profile data (opt-in, first deploy only)
        if: ${{ inputs.run_seed == true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: yarn db:seed

  deploy:
    name: Deploy container
    runs-on: ubuntu-latest
    needs: migrate
    environment: production

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Replace this step with your host's deploy trigger. Both are no-ops unless the
      # corresponding secret is configured, so this workflow does not claim a deployment
      # that did not happen.
      - name: Trigger host deploy
        if: ${{ secrets.DEPLOY_HOOK_URL != '' }}
        run: curl -fsS -X POST "${{ secrets.DEPLOY_HOOK_URL }}"

      - name: Verify the deployed instance is healthy
        if: ${{ secrets.PRODUCTION_URL != '' }}
        run: |
          echo "Waiting for the new revision to report healthy..."
          for attempt in $(seq 1 30); do
            if curl -fsS "${{ secrets.PRODUCTION_URL }}/api/v1/health" > /tmp/health.json; then
              cat /tmp/health.json
              echo "Healthy after ${attempt} attempt(s)."
              exit 0
            fi
            sleep 10
          done
          echo "Health check never succeeded - the deploy is NOT verified." >&2
          exit 1
